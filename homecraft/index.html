<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#285f61">
<!-- The world draws its own day and night. -->
<meta name="color-scheme" content="only light">
<meta name="darkreader-lock">
<title>北工大 · 校园漫游</title>
<meta name="description" content="基于校园地图搭建的北京工业大学平乐园 3D 校园，漫游建筑、操场与校园里的故事。">
<meta property="og:type" content="website">
<meta property="og:title" content="北工大 · 校园漫游">
<meta property="og:description" content="沿着熟悉的路，重新走进平乐园。">
<meta property="og:image" content="assets/campus-reference.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" sizes="any" href="assets/campus-favicon.svg?v=3">
<link rel="stylesheet" href="engine/style.css">
<link rel="stylesheet" href="world/campus.css">
<script type="importmap">{"imports":{
  "three":"./vendor/three/three.module.min.js",
  "@engine/":"./engine/",
  "@world/":"./world/",
  "@config":"./home.config.js"
}}</script>
</head>
<body>
<main id="world" aria-label="北工大 · 校园漫游"></main>
<div id="loading" aria-labelledby="campus-loading-title">
  <div class="campus-loading-brand">
    <img src="assets/campus-logo.png" width="118" height="74" alt="" fetchpriority="high" decoding="async">
    <p class="campus-loading-eyebrow">BEIJING UNIVERSITY OF TECHNOLOGY</p>
    <h1 id="campus-loading-title">北工大 · 校园漫游</h1>
    <p class="campus-loading-caption">沿着熟悉的路，重新走进平乐园。</p>
  </div>
  <div class="campus-loading-progress">
    <p>正在准备 3D 校园</p>
    <div class="bar" role="progressbar" aria-label="加载校园" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8"><i></i></div>
  </div>
</div>

<section id="pages">
  <h1 class="plain-title">北工大 · 校园漫游</h1>
  <article class="page" data-station="overview" data-icon="map">
    <h2>北京工业大学 · 平乐园校区</h2>
    <p>沿着熟悉的路，重新走进校园。启用 JavaScript 后可以自由漫游、点击建筑查看地点介绍。</p>
    <p>场景依据校园示意图近似还原，地点故事将陆续补充。</p>
    <p><a href="https://daixiaokang.com/">返回个人网站</a></p>
  </article>
</section>

<!-- file:// cannot load the world modules. -->
<script>
if (location.protocol === 'file:') {
  const zh = /^zh/i.test(navigator.language), note = document.createElement('aside');
  note.id = 'startupNotice';
  note.innerHTML = zh
    ? '<h2>请用本地服务器打开</h2><p>直接双击打开时，浏览器不会加载 3D 世界。在这个文件夹里运行 <code>python3 tools/serve.py</code>（Windows 用 <code>python tools/serve.py</code>），它会找一个空闲端口并自动打开页面。地址也会打印在终端里。</p>'
    : '<h2>Open it through a local server</h2><p>Browsers don’t load the 3D world from a double-clicked file. In this folder, run <code>python3 tools/serve.py</code> (on Windows, <code>python tools/serve.py</code>). It picks a free port and opens the page. The address is also printed in the terminal.</p>';
  document.getElementById('pages').before(note);
  document.getElementById('loading')?.remove();
  document.body.classList.add('plain');
}
</script>
<noscript><style>#world,#hud,#loading{display:none}#pages{display:block}</style></noscript>
<script type="module" src="engine/main.js"></script>
</body>
</html>
